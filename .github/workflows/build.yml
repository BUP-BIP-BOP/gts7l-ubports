name: build

on:
  push:
    branches: [main, master]
    # The build clones the UBports adaptation tools and runs those; nothing
    # under tools/ or docs/ can change its output, so pushes touching only
    # those must not spend runner time.
    paths-ignore:
      - 'tools/**'
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  pull_request:
  workflow_dispatch:
    inputs:
      build_rootfs:
        description: 'Also build ubuntu.img (slow; unchanged unless deviceinfo/overlay moved)'
        type: boolean
        default: true
      reuse_kernel_from:
        description: 'Run id to take the device tarball from, instead of rebuilding the kernel'
        type: string
        default: ''

# A newer push supersedes an in-flight build of the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 22.04 is required: the AOSP clang prebuilts need libtinfo5 and the tools
  # still call python2, neither of which exists in 24.04.
  IMAGE: ubuntu:22.04

jobs:
  # Kernel, boot, dtbo, recovery and the device tarball. ~20 minutes, and the
  # artifact is small enough to pull over a bad link.
  kernel:
    # Skipped when reuse_kernel_from names an earlier run: the kernel takes
    # ~20 minutes and does not change when only the rootfs release moves.
    if: github.event_name != 'workflow_dispatch' || inputs.reuse_kernel_from == ''
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 180
    steps:
      - name: Install build dependencies
        run: |
          apt update
          apt install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl fakeroot flex \
            git kmod libelf-dev libssl-dev libtinfo5 lz4 python2 python3 \
            python3-pip sudo unzip wget xz-utils pahole libbpf-dev
          ln -sf python2 /usr/bin/python

      - uses: actions/checkout@v4

      - name: Clone adaptation build tools
        run: git clone --depth=1 https://gitlab.com/ubports/porting/community-ports/halium-generic-adaptation-build-tools build

      - name: Build kernel and boot images
        run: ./build/build.sh

      # build.sh leaves the images inside the device tarball (partitions/), not
      # in out/ — those only appear when system-image-from-ota.sh unpacks the
      # tarball in the rootfs job. Pull them out so this job can ship flashable
      # files without doing the slow rootfs work.
      - name: Extract the boot images from the device tarball
        run: |
          DEVICE="$(. ./deviceinfo && echo "$deviceinfo_codename")"
          tar -xf "out/device_${DEVICE}.tar.xz" -C out partitions/
          mv out/partitions/*.img out/
          rmdir out/partitions
          ls -l out/*.img

      # Samsung's ABL parses the AVB footer of the image it boots even with
      # verification disabled in vbmeta. Unsigned images stop at the splash
      # with no kernel and no USB, so sign here and ship ready-to-flash files.
      - name: Sign boot and recovery
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/external/avb /tmp/avb
          KEY=/tmp/avb/test/data/testkey_rsa4096.pem
          for spec in "boot:71303168" "recovery:86888448"; do
            name="${spec%%:*}"; size="${spec##*:}"
            [ -f "out/$name.img" ] || continue
            python3 /tmp/avb/avbtool.py erase_footer --image "out/$name.img" 2>/dev/null || true
            # Match stock: the header's product field carries SRPTC18C005.
            # Header first, footer second, or the hash no longer covers it.
            python3 tools/set-board-name.py "out/$name.img"
            python3 /tmp/avb/avbtool.py add_hash_footer \
              --image "out/$name.img" --partition_name "$name" \
              --partition_size "$size" --algorithm SHA256_RSA4096 \
              --key "$KEY" --rollback_index 1900000000
          done

      - name: Build vbmeta with verification disabled
        run: python3 /tmp/avb/avbtool.py make_vbmeta_image --flags 3 --padding_size 4096 --output out/vbmeta-disabled.img

      - uses: actions/upload-artifact@v4
        with:
          name: gts7l-kernel
          if-no-files-found: error
          path: |
            out/boot.img
            out/dtbo.img
            out/recovery.img
            out/vbmeta-disabled.img

      # Consumed by the rootfs job; kept separate so the flashable images stay
      # a small download.
      - uses: actions/upload-artifact@v4
        with:
          name: gts7l-device-tarball
          if-no-files-found: error
          path: out/device_*.tar.xz

  # ubuntu.img: the UT rootfs, the Halium container and our overlay. ~10
  # minutes and ~700 MB, and it only changes when deviceinfo or overlay/ do.
  rootfs:
    needs: kernel
    if: |
      always()
      && (github.event_name != 'workflow_dispatch' || inputs.build_rootfs)
      && (needs.kernel.result == 'success' || needs.kernel.result == 'skipped')
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 180
    steps:
      - name: Install build dependencies
        run: |
          apt update
          apt install -y --no-install-recommends \
            ca-certificates curl git img2simg jq sudo unzip wget xz-utils zstd \
            e2fsprogs python3

      - uses: actions/checkout@v4

      - name: Clone adaptation build tools
        run: git clone --depth=1 https://gitlab.com/ubports/porting/community-ports/halium-generic-adaptation-build-tools build

      - uses: actions/download-artifact@v4
        with:
          name: gts7l-device-tarball
          path: out
          # Falls back to this run's kernel job when the input is empty.
          run-id: ${{ inputs.reuse_kernel_from || github.run_id }}
          github-token: ${{ github.token }}

      - name: Build flashable rootfs
        run: |
          DEVICE="$(. ./deviceinfo && echo "$deviceinfo_codename")"
          TARBALL="$(ls out/device_${DEVICE}*.tar.xz | head -n1)"
          ./build/prepare-fake-ota.sh "$TARBALL" ota
          ./build/system-image-from-ota.sh ota/ubuntu_command out
          mv out/rootfs.img out/ubuntu.img
          zstd -19 -T0 --rm out/ubuntu.img

      - uses: actions/upload-artifact@v4
        with:
          name: gts7l-rootfs
          if-no-files-found: error
          path: out/ubuntu.img.zst
