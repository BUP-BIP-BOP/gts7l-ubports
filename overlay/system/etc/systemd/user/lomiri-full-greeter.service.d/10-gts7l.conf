[Service]
# libhybris on this device needs the TLS padding preload: Bionic libc clobbers
# the thread-local storage area of the glibc process that loads it. The system
# compositor gets this from lsc-wrapper and its EGL comes up fine; the shell is
# started by lomiri-systemd-wrapper, which does not set it, and its EGL init
# fails with "must have at least EGL 1.4".
Environment=LD_PRELOAD=libtls-padding.so
