gts7l:
  Vendor: Samsung
  PrettyName: Galaxy Tab S7 LTE
  DeviceType: tablet
  # 2560x1600 @ 11" -> LineageOS ships TARGET_SCREEN_DENSITY 320 (xhdpi)
  GridUnit: 16
  SupportedOrientations:
    - Portrait
    - InvertedPortrait
    - Landscape
    - InvertedLandscape
  PrimaryOrientation:
    - Landscape
  LomiriInteractiveBlur:
    - true
  NumBuiltInDisplays: 1
  OfonoPlugin: binder
  OfonoImplementsIms: true
  # Confirmed on stock: /sys/class/backlight holds panel and panel0-backlight,
  # /sys/class/leds is empty — the tablet has no flash LED, so no
  # FlashlightSysfsPath here.
  BacklightSysfsPath:
    - /sys/class/backlight/panel0-backlight
