# SM-T875 is single-SIM. If your unit is dual-SIM (T876B variants), add slot2.
# radioInterface must match the HAL the vendor actually exposes. Measured with
# `lshal | grep radio@` on stock: the highest is android.hardware.radio@1.5,
# consistent with the API 30 vendor.
[Settings]
ExpectSlots = slot1
extPlugin = qti
radioInterface = 1.5
emptyPinQuery = false
useDataProfiles = true
mmsDataProfileId = 1001
# RIL_REQUEST_HANGUP_WAITING_OR_BACKGROUND
rilRequestOnSetUdub = 13

[slot1]
path = /ril_0
slot = 0
