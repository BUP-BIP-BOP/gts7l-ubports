# SM-T875 is single-SIM. If your unit is dual-SIM (T876B variants), add slot2.
# radioInterface must match the HAL the vendor partition actually exposes:
# check with `lshal | grep radio` inside the container. Android 13 vendors
# normally ship android.hardware.radio@1.6.
[Settings]
ExpectSlots = slot1
extPlugin = qti
radioInterface = 1.6
emptyPinQuery = false
useDataProfiles = true
mmsDataProfileId = 1001
# RIL_REQUEST_HANGUP_WAITING_OR_BACKGROUND
rilRequestOnSetUdub = 13

[slot1]
path = /ril_0
slot = 0
