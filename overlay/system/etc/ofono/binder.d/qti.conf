# SM-T875 is single-SIM. If your unit is dual-SIM (T876B variants), add slot2.
# radioInterface: check with `getprop | grep radio` / lshal inside the container;
# kona on Android 11 usually exposes android.hardware.radio@1.4 or 1.5.
[Settings]
ExpectSlots = slot1
extPlugin = qti
radioInterface = 1.4
emptyPinQuery = false
useDataProfiles = true
mmsDataProfileId = 1001
# RIL_REQUEST_HANGUP_WAITING_OR_BACKGROUND
rilRequestOnSetUdub = 13

[slot1]
path = /ril_0
slot = 0
