# Sensor adaptors come from the Android HIDL HALs inside the container.
# The transformation matrices below are a starting point copied from another
# SM8xxx Samsung port — recalibrate on device with:
#   sensorfwd -l 5 --no-magnetometer-bg-calibration
#   /usr/lib/*/sensorfw/tests/... or `luna` style dumps; simplest is to rotate
#   the tablet and watch `dbus-monitor` values for accelerometer.
[plugins]
accelerometeradaptor = hidlaccelerometeradaptor
alsadaptor = hidlalsadaptor
proximityadaptor = hidlproximityadaptor
magnetometeradaptor = hidlmagnetometeradaptor
gyroscopeadaptor = hidlgyroscopeadaptor
orientationadaptor = hidlorientationadaptor
stepcounteradaptor = hidlstepcounteradaptor
pressureadaptor = hidlpressureadaptor

[magnetometer]
scale_coefficient = 1
transformation_matrix = "-1,0,0,0,1,0,0,0,1"
needs_calibration = 0

# Landscape-native panel: axes are swapped relative to a phone. VERIFY.
[accelerometer]
transformation_matrix = "0,-1,1,1,0,0,0,0,1"
