# Compositor knobs for gts7l.
#
# MIR_ANDROID_FORCE_HWC2 makes Mir's android platform take the HWC2 path
# through libhwc2_compat_layer instead of probing for a HWC1 HAL first. Without
# it the compositor logs "Error opening HWC HAL" and its buffer handling breaks
# down with "dequeueBuffer: state was not valid".
export MIR_ANDROID_FORCE_HWC2=1

# Hardware overlays are unreliable on Halium: compose on the GPU instead.
LSC_FLAGS="--enable-num-framebuffers-quirk=true --disable-overlays=true"
