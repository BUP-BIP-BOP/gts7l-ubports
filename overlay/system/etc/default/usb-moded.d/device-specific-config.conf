# usb-moded configuration for SM-T875.
#
# Without the IDs usb-moded falls back to the pid.codes test range, which makes
# the tablet look bogus to hosts (Windows in particular).
# Samsung uses one vendor ID and a single composite product ID across modes.

IDVENDOR=04E8
IDPRODUCT_MTP=6860
IDPRODUCT_MTP_ADB=6860
IDPRODUCT_RNDIS=6860
IDPRODUCT_RNDIS_ADB=6860

MANUFACTURER=Samsung
PRODUCT=SM-T875

# Rescue mode stays ON deliberately while the port is being brought up: it is
# what gives a shell over USB when the UI does not come up. The guide recommends
# USB_MODED_ARGS="" to disable it, but only once the device boots reliably.
#USB_MODED_ARGS=""
